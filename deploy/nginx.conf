server {
    listen 8753 ssl;
    server_name @BOARD_IP@;
    ssl_certificate /var/lib/project-board-acme/config/live/project-board-ip/fullchain.pem;
    ssl_certificate_key /var/lib/project-board-acme/config/live/project-board-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24m;
    access_log /var/log/nginx/project-board.access.log;
    error_log /var/log/nginx/project-board.error.log;

    location / {
        auth_basic "WeMol Project Board";
        auth_basic_user_file /etc/project-board/readers.htpasswd;

        limit_except GET {
            auth_basic_user_file /etc/project-board/writers.htpasswd;
        }

        proxy_pass http://127.0.0.1:48753;
        proxy_set_header Host 127.0.0.1:48753;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
    }
}
